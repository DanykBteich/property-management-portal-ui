<div class="add-properties-header">
  <button class="back-button" type="button" (click)="goBack()">← Back</button>
</div>

<form #propertyForm="ngForm" (ngSubmit)="onSubmit(propertyForm)" class="property-form">
  <h2>{{ propId ? 'Edit Property' : 'Add New Property' }}</h2>

  <div class="form-group">
    <label for="address">Address</label>
    <input
      id="address"
      name="address"
      type="text"
      [(ngModel)]="propAddress"
      required
      #addressModel="ngModel"
      placeholder="123 Main St"
    />
    <div class="error" *ngIf="addressModel.invalid && addressModel.touched">
      Address is <strong>required</strong>
    </div>
  </div>

  <div class="form-row">
    <div class="form-group half-width">
      <label for="price">Price (€)</label>
      <input
        id="price"
        name="price"
        type="number"
        [(ngModel)]="propPrice"
        required
        #priceModel="ngModel"
        placeholder="250000"
      />
      <div class="error" *ngIf="priceModel.invalid && priceModel.touched">
        Price is <strong>required</strong>
      </div>
    </div>

    <div class="form-group half-width">
      <label for="purchaseDate">Purchase Date</label>
      <input
        id="purchaseDate"
        name="purchaseDate"
        type="date"
        [(ngModel)]="propPurchaseDate"
        required
        #dateModel="ngModel"
      />
      <div class="error" *ngIf="dateModel.invalid && dateModel.touched">
        Purchase Date is <strong>required</strong>
      </div>
    </div>
  </div>

  <div class="form-row">
    <div class="form-group half-width">
      <label for="status">Status</label>
      <select
        id="status"
        name="status"
        [(ngModel)]="propStatus"
        required
      >
        <option value="Occupied">Occupied</option>
        <option value="Vacant">Vacant</option>
      </select>
    </div>

    <div class="form-group half-width">
      <label for="type">Type</label>
      <select
        id="type"
        name="type"
        [(ngModel)]="propType"
        required
      >
        <option value="Commercial">Commercial</option>
        <option value="Residential">Residential</option>
      </select>
    </div>
  </div>

  <button type="submit" [disabled]="propertyForm.invalid">
    {{ propId ? 'Save Changes' : 'Add Property' }}
  </button>
</form>
